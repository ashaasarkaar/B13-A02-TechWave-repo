<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B13-A02-Tech-Wave</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/style.css">
<script src="https://kit.fontawesome.com/b835983076.js" crossorigin="anonymous"></script>
</head>
<body class="inter-font">
    <header class="bg-[#1A0B2E] border-b border-b-[rgba(65,37,103,1)]">
        <nav class="flex justify-between items-center py-4 px-50">
            <h1 class="text-white font-extrabold text-5xl">Tech<span class="linear-text font-extrabold text-5xl">Wave</span></h1>
            <ul class="flex gap-4">
                <li class="text-base"><a href="">About</a></li>
                <li class="text-base"><a href="">Episodes</a></li>
                <li class="text-base"><a href="">Host</a></li>
            </ul>
            <button class="text-white py-3 px-3 btn-primary font-semibold text-base">Subscribe<i class="fa-solid fa-arrow-right"></i></button>
            <div class="hamburger-menu">
                <img src="./assets/hamburger-menu.png" alt="menu-hide">
            </div>
        </nav>
    </header>
    <main>
        <section class="bannar-section text-center">
            <!-- first part -->
            <div class="circle-images-container">
                <img class="big-circle-img" src="./assets/hero-circle.png" alt="gradient-circle-png">
                <img class="small-circle-img" src="./assets/microphone.png" alt="microphone-image">
                <button class="badge-new font-semibold text-[1.125rem] px-4 py-2">NEW</button>
            </div>
            <!-- second part -->
             <div class="bannar-text-container">
                <h1 class="bannar-heading font-extrabold text-6xl">TechWave</h1>
                <p class="text-base text-[#FFFFFF] mt-2">Your daily dose of tech insights, productivity hacks, and personal growth</p>
                <div class="bannar-btns mt-5 flex justify-center">
                <button class="btn-primary font-semibold py-3 px-5 text-base mr-4 text-white flex items-center gap-2">
                    <img src="./assets/spotify.png" alt="spotify-icon">
                    Listen on Spotify
                </button>
                <button class="btn-2 py-3 px-5 font-semibold text-base flex items-center gap-2">
                    <img class="" src="./assets/message.png" alt="message-icon">
                    Subscribe
                </button>
                </div>

             </div>


        </section>

    </main>

    
</body>
</html>
